<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scanning Ghost</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      background: url('https://cdn.pixabay.com/photo/2021/02/13/12/49/house-6011465_640.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 24px;
      overflow-x: hidden;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      pointer-events: none;
      z-index: 0;
    }

    .scanner-container {
      position: relative;
      z-index: 1;
      background: rgba(6, 6, 18, 0.92);
      border-radius: 22px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.55);
      padding: 30px 28px;
      text-align: center;
      width: min(92vw, 420px);
      max-width: 420px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #radar {
      display: block;
      width: 100%;
      max-width: 300px;
      height: auto;
      aspect-ratio: 1;
      margin: 0 auto 18px auto;
      background: rgba(24, 24, 36, 0.75);
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.55) inset;
    }

    #ghostLogoCircle {
      display: none;
      margin: 30px auto 0 auto;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 32px 8px rgba(0, 0, 0, 0.5), 0 0 0 8px #23234a;
      background: #181824;
      position: relative;
      animation: ghostPop 0.8s ease forwards;
    }

    #ghostLogoCircle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    @keyframes ghostPop {
      0% { transform: scale(0.2) rotate(-20deg); opacity: 0; }
      60% { transform: scale(1.1) rotate(8deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    #connectMsg {
      margin-top: 24px;
      font-size: 1.1rem;
      color: #d895b3;
      animation: fadeIn 0.7s ease;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
      line-height: 1.5;
    }

    #getStartedBtn {
      display: none;
      margin: 28px auto 0 auto;
      padding: 14px 32px;
      width: min(100%, 220px);
      background: linear-gradient(90deg, #4cc9f0 0%, #f72585 100%);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
      transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    #getStartedBtn:hover {
      background: linear-gradient(90deg, #f72585 0%, #4cc9f0 100%);
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: clamp(1.9rem, 5vw, 2.5rem);
      text-shadow: 2px 2px 12px rgba(0, 0, 0, 0.6);
      margin-bottom: 18px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 720px) {
      body { padding: 18px; background-attachment: scroll; }
      .scanner-container { padding: 24px 20px; width: min(92vw, 420px); }
      #radar { max-width: 260px; }
      #ghostLogoCircle { width: 120px; height: 120px; }
      #getStartedBtn { width: 100%; padding: 14px 18px; }
      #connectMsg { font-size: 1rem; }
    }

    @media (max-width: 520px) {
      body { padding: 14px; }
      .scanner-container { padding: 20px 16px; width: min(96vw, 380px); }
      h1 { font-size: clamp(1.7rem, 7vw, 2.2rem); }
      #radar { max-width: 220px; }
      #ghostLogoCircle { width: 110px; height: 110px; }
      #connectMsg { font-size: 0.95rem; }
      #getStartedBtn { font-size: 0.95rem; padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <!-- Background music audio element -->
  <audio id="bg-music" src="horror-box-149248.mp3" autoplay loop hidden></audio>
  
  <div class="scanner-container">
    <h1>🔍 Searching for Ghosts in Your Area</h1>
    <canvas id="radar" width="300" height="300"></canvas>
    <div id="ghostLogoCircle">
      <img src="scary.jpg" alt="Ghost">
    </div>
    <div id="connectMsg"></div>
    <button id="getStartedBtn">Get Started</button>
  </div>
  <script>
    // Ghost names
    const ghostNames = [
      "Paramakudi Ekamparam", "Thoothukudi Mooniyamma", "Keilpakam Ramesh ", "Gopalapuram gopal",
      "Soolamedu sundari", "Karu karu Rakkamma", "Kodangi kumaru", "Kada Kumaru",
      "Yamakaathagi", "Jamini", "Pottu palayam perumalu", "Alankulam Pandi"
    ];

    // Pick a random set of ghosts (3-7) and one to auto-connect
    function getRandomGhosts() {
      const shuffled = ghostNames.slice().sort(() => 0.5 - Math.random());
      const count = Math.floor(Math.random() * 5) + 3;
      return shuffled.slice(0, count);
    }
    const foundGhosts = getRandomGhosts();
    const autoConnectIndex = Math.floor(Math.random() * foundGhosts.length);
    const autoConnectGhost = foundGhosts[autoConnectIndex];

    // Radar setup
    const radar = document.getElementById('radar');
    const ctx = radar.getContext('2d');
    const radarCenter = { x: radar.width / 2, y: radar.height / 2 };
    const radarRadius = 135;

    // Place ghost dots randomly on the radar
    function getRandomDotPositions(count) {
      let dots = [];
      for (let i = 0; i < count; i++) {
        let r = Math.random() * (radarRadius - 20) + 30;
        let theta = Math.random() * 2 * Math.PI;
        let x = radarCenter.x + r * Math.cos(theta);
        let y = radarCenter.y + r * Math.sin(theta);
        dots.push({ x, y });
      }
      return dots;
    }
    const ghostDots = getRandomDotPositions(foundGhosts.length);

    // Radar animation variables
    let scanning = true;
    let angle = 0;
    let sweepSpeed = 0.03;

    function drawRadar() {
      ctx.clearRect(0, 0, radar.width, radar.height);

      // Draw radar circles
      ctx.save();
      ctx.globalAlpha = 0.3;
      ctx.strokeStyle = "#4cc9f0";
      for (let i = 1; i <= 3; i++) {
        ctx.beginPath();
        ctx.arc(radarCenter.x, radarCenter.y, (radarRadius / 3) * i, 0, 2 * Math.PI);
        ctx.stroke();
      }
      ctx.restore();

      // Draw cross lines
      ctx.save();
      ctx.strokeStyle = "#4cc9f055";
      ctx.beginPath();
      ctx.moveTo(radarCenter.x, radarCenter.y - radarRadius);
      ctx.lineTo(radarCenter.x, radarCenter.y + radarRadius);
      ctx.moveTo(radarCenter.x - radarRadius, radarCenter.y);
      ctx.lineTo(radarCenter.x + radarRadius, radarCenter.y);
      ctx.stroke();
      ctx.restore();

      // Draw ghost dots
      ghostDots.forEach((dot, i) => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, 10, 0, 2 * Math.PI);
        ctx.fillStyle = (i === autoConnectIndex) ? "#4cc9f0" : "#f72585";
        ctx.shadowColor = (i === autoConnectIndex) ? "#4cc9f0" : "#f72585";
        ctx.shadowBlur = (i === autoConnectIndex) ? 22 : 14;
        ctx.fill();
        ctx.restore();
      });

      // Draw sweeping line
      if (scanning) {
        ctx.save();
        ctx.strokeStyle = "#4cc9f0";
        ctx.globalAlpha = 0.8;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(radarCenter.x, radarCenter.y);
        ctx.lineTo(
          radarCenter.x + radarRadius * Math.cos(angle),
          radarCenter.y + radarRadius * Math.sin(angle)
        );
        ctx.stroke();

        // Draw sweep gradient
        let grad = ctx.createRadialGradient(radarCenter.x, radarCenter.y, 0, radarCenter.x, radarCenter.y, radarRadius);
        grad.addColorStop(0, 'rgba(76, 201, 240, 0.3)');
        grad.addColorStop(1, 'rgba(76, 201, 240, 0)');
        ctx.beginPath();
        ctx.moveTo(radarCenter.x, radarCenter.y);
        ctx.arc(radarCenter.x, radarCenter.y, radarRadius, angle - 0.3, angle + 0.3);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.restore();
      }
    }

    function animateRadar() {
      if (!scanning) return;
      angle += sweepSpeed;
      if (angle > 2 * Math.PI) angle -= 2 * Math.PI;
      drawRadar();
      requestAnimationFrame(animateRadar);
    }

    // Animate radar for a few seconds, then show connection message and ghost logo
    drawRadar();
    animateRadar();

    setTimeout(() => {
      scanning = false;
      drawRadar();
      document.getElementById('ghostLogoCircle').style.display = 'block';
      document.getElementById('connectMsg').innerHTML =
        `🔮 Connected to <b>${autoConnectGhost}</b>!<br>Stay alert for paranormal activity in your area...`;
      // Optionally hide the radar after scan
      document.getElementById('radar').style.display = 'none';
      // Show the Get Started button
      document.getElementById('getStartedBtn').style.display = 'block';
    }, 3200);

    // Get Started button action
    document.getElementById('getStartedBtn').onclick = function() {
      window.location.href = 'ouija.html';
    };

    // Optional: Unmute audio on user interaction if browser blocks autoplay
    document.body.addEventListener('click', function() {
      const audio = document.getElementById('bg-music');
      if (audio.paused) {
        audio.play();
      }
    });
  </script>
</body>
</html>
