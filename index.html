<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ouija Board</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-image: url('house2.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .welcome {
      background: rgba(20,18,40,0.92);
      border-radius: 20px;
      box-shadow: 0 0 40px #000a;
      padding: 40px 36px;
      min-width: 340px;
      max-width: 420px;
      text-align: center;
      animation: fadeIn 1s;
    }
    .welcome h1 {
      font-size: 2.2em;
      margin-bottom: 12px;
      letter-spacing: 2px;
      text-shadow: 2px 2px 10px #000c;
    }
    .welcome p {
      font-size: 1.1em;
      margin-bottom: 28px;
      color: #b6b6e4;
    }
    .loading-bar {
      width: 100%;
      height: 10px;
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      overflow: hidden;
      margin: 0 auto 20px auto;
    }
    .loading-bar span {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #f72585, #4cc9f0);
      animation: loadingProgress 2s ease-in-out forwards;
    }
    @keyframes loadingProgress {
      to { width: 100%; }
    }
    .start-btn {
      background: linear-gradient(90deg, #f72585 0%, #4cc9f0 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 32px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 10px #0004;
      transition: background 0.2s, transform 0.2s;
    }
    .start-btn:hover {
      background: linear-gradient(90deg, #4cc9f0 0%, #f72585 100%);
      transform: scale(1.05);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px);}
      to   { opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <!-- Background music -->
  <audio id="bg-music" src="ghost-girl-in-my-room-158693.mp3" autoplay muted loop style="display:none"></audio>

  <div id="loadingScreen" class="welcome" style="width: 100%; max-width: 420px;">
    <h1>Preparing the Silance...</h1>
    <p>Spirits are waking. Please wait a moment.</p>
    <div class="loading-bar">
      <span></span>
    </div>
  </div>

  <!-- Welcome Page -->
  <div class="welcome" id="welcomeScreen" style="display:none;">
    <h1>🔮 Ouija Board Game</h1>
    <p>Welcome, seeker of mysteries!<br>
      Are you ready to contact the spirits?<br>
      Click below to begin your Ouija experience...</p>
    <button class="start-btn" id="startBtn">Start Game</button>
  </div>
  <script>
    const welcomeScreen = document.getElementById('welcomeScreen');
    const loadingScreen = document.getElementById('loadingScreen');
    const startBtn = document.getElementById('startBtn');
    const audio = document.getElementById('bg-music');

    function showWelcome() {
      loadingScreen.style.display = 'none';
      welcomeScreen.style.display = 'block';
      welcomeScreen.style.animation = 'fadeIn 1s ease';
    }

    document.addEventListener('DOMContentLoaded', () => {
      audio.play().catch(() => {});
      setTimeout(showWelcome, 2200);
    });

    startBtn.addEventListener('click', () => {
      window.location.href = 'home.html';
    });

    // Unmute audio on user interaction
    document.body.addEventListener('click', function() {
      if (audio) {
        audio.muted = false;
        audio.play();
      }
    }, {once: true});
  </script>
</body>
</html>
