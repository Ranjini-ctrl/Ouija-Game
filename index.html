<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ouija Board</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-image: url('house2.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .welcome {
      background: rgba(20,18,40,0.92);
      border-radius: 20px;
      box-shadow: 0 0 40px #000a;
      padding: 40px 36px;
      min-width: 340px;
      max-width: 420px;
      text-align: center;
      animation: fadeIn 1s;
    }
    .welcome h1 {
      font-size: 2.2em;
      margin-bottom: 12px;
      letter-spacing: 2px;
      text-shadow: 2px 2px 10px #000c;
    }
    .welcome p {
      font-size: 1.1em;
      margin-bottom: 28px;
      color: #b6b6e4;
    }
    .start-btn {
      background: linear-gradient(90deg, #f72585 0%, #4cc9f0 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 32px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 10px #0004;
      transition: background 0.2s, transform 0.2s;
    }
    .start-btn:hover {
      background: linear-gradient(90deg, #4cc9f0 0%, #f72585 100%);
      transform: scale(1.05);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px);}
      to   { opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <!-- Background music -->
  <audio id="bg-music" src="ghost-girl-in-my-room-158693.mp3" autoplay loop style="display:none"></audio>
  <!-- Welcome Page -->
  <div class="welcome" id="welcomeScreen">
    <h1>🔮 Ouija Board Game</h1>
    <p>Welcome, seeker of mysteries!<br>
      Are you ready to contact the spirits?<br>
      Click below to begin your Ouija experience...</p>
    <button class="start-btn" id="startBtn">Start Game</button>
  </div>
  <script>
    const welcomeScreen = document.getElementById('welcomeScreen');
    const startBtn = document.getElementById('startBtn');

    startBtn.addEventListener('click', () => {
  window.location.href = 'home.html';


    });

    // Unmute audio on user interaction if browser blocks autoplay
    document.body.addEventListener('click', function() {
      const audio = document.getElementById('bg-music');
      if (audio && audio.paused) {
        audio.play();
      }
    });
  </script>
</body>
</html>
