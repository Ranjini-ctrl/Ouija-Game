<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ouija Board</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-image: url('house2.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow-x: hidden;
      background-color: #070609;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      pointer-events: none;
      z-index: 0;
    }

    .welcome {
      position: relative;
      z-index: 1;
      background: rgba(18, 16, 34, 0.96);
      border-radius: 24px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.55);
      padding: 36px 32px;
      width: min(92vw, 460px);
      max-width: 460px;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 0.8s ease forwards;
    }

    .welcome h1 {
      font-size: clamp(2rem, 4vw, 2.4rem);
      margin-bottom: 16px;
      letter-spacing: 2px;
      text-shadow: 2px 2px 12px rgba(0, 0, 0, 0.55);
    }

    .welcome p {
      font-size: 1rem;
      margin-bottom: 30px;
      color: #d8d8f0;
      line-height: 1.6;
    }



    .start-btn {
      background: linear-gradient(90deg, #f72585 0%, #4cc9f0 100%);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 14px 32px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(247, 37, 133, 0.25);
      transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
      width: min(100%, 260px);
    }

    .start-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 15px 30px rgba(247, 37, 133, 0.35);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes loadingProgress {
      to { width: 100%; }
    }

    @media (max-width: 520px) {
      body { padding: 18px; }
      .welcome { padding: 24px; }
      .welcome p { font-size: 0.98rem; }
      .start-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <!-- Background music -->
  <audio id="bg-music" src="ghost-girl-in-my-room-158693.mp3" autoplay muted loop style="display:none"></audio>

  <!-- Welcome Page -->
  <div class="welcome" id="welcomeScreen" style="display:none;">
    <h1>🔮 Ouija Board Game</h1>
    <p>Welcome, seeker of mysteries!<br>
      Are you ready to contact the spirits?<br>
      Click below to begin your Ouija experience...</p>
    <button class="start-btn" id="startBtn">Start Game</button>
  </div>
  <script>
    const welcomeScreen = document.getElementById('welcomeScreen');
    const startBtn = document.getElementById('startBtn');
    const audio = document.getElementById('bg-music');

    function showWelcome() {
    welcomeScreen.style.display = 'block';
      welcomeScreen.style.opacity = '1';
      welcomeScreen.style.transform = 'translateY(0)';
    }

    document.addEventListener('DOMContentLoaded', () => {
      audio.play().catch(() => {});
    });

    startBtn.addEventListener('click', () => {
      window.location.href = 'home.html';
    });

    // Unmute audio on user interaction
    document.body.addEventListener('click', function() {
      if (audio) {
        audio.muted = false;
        audio.play();
      }
    }, {once: true});
  </script>
</body>
</html>
