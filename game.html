<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghostly RPS Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Nosifer', cursive;
      background: url('https://cdn.pixabay.com/photo/2018/01/31/07/36/secret-3120483_1280.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #ff4444;
      text-align: center;
      padding: 28px 20px 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      pointer-events: none;
      z-index: 0;
    }

    h1 {
      font-size: clamp(2.4rem, 6vw, 3.4rem);
      margin-bottom: 18px;
      text-shadow: 0 0 15px rgba(255, 0, 0, 0.65);
      z-index: 1;
    }
    h2 {
      font-size: clamp(1.6rem, 4vw, 2rem);
      margin-bottom: 22px;
      text-shadow: 0 0 12px rgba(255, 0, 0, 0.55);
      z-index: 1;
    }

    .game-shell {
      width: min(92vw, 760px);
      max-width: 760px;
      padding: 26px 24px 30px;
      background: rgba(0, 0, 0, 0.76);
      border: 2px solid rgba(255, 68, 68, 0.35);
      border-radius: 26px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.65);
      position: relative;
      z-index: 1;
    }

    .choices {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
      margin-bottom: 32px;
    }

    .choose {
      background-color: rgba(0, 0, 0, 0.75);
      border: 3px solid rgba(255, 0, 0, 0.8);
      border-radius: 50%;
      width: 110px;
      height: 110px;
      font-size: 2.1rem;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(255, 0, 0, 0.3);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      display: grid;
      place-items: center;
    }

    .choose:hover {
      transform: scale(1.08);
      box-shadow: 0 0 34px rgba(255, 0, 0, 0.5);
      border-color: #ff7a7a;
    }

    .score {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      font-size: 1.1rem;
      color: #fff;
      margin-bottom: 32px;
      z-index: 1;
    }

    .score h3 {
      margin: 0 0 10px;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ff9d9d;
    }

    .result {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      color: #ff7f7f;
      text-shadow: 0 0 14px rgba(255, 0, 0, 0.4);
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.25s ease;
      z-index: 1;
    }

    #exit-button {
      margin-top: 30px;
      padding: 14px 24px;
      font-size: 1.1rem;
      background-color: rgba(0, 0, 0, 0.85);
      color: #ff4d4d;
      border: 2px solid rgba(255, 68, 68, 0.9);
      cursor: pointer;
      display: none;
      box-shadow: 0 0 20px rgba(255, 68, 68, 0.35);
      border-radius: 999px;
      transition: transform 0.25s ease, background-color 0.25s ease, color 0.25s ease;
      z-index: 1;
    }

    #exit-button:hover {
      background-color: #ff4d4d;
      color: black;
      transform: translateY(-2px);
    }

    .choice-img {
      width: 70px;
      height: 70px;
    }

    @media (max-width: 640px) {
      body { padding: 18px 14px 28px; }
      .game-shell { padding: 20px 18px 24px; }
      .choices { gap: 18px; }
      .choose { width: 88px; height: 88px; font-size: 1.8rem; }
      .score { gap: 26px; font-size: 1rem; }
      #exit-button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <h1>Rock ✊🏼 — Paper 🖐🏼 — Scissors ✌🏼<br>👻 With a Ghost! 👻</h1>
    <audio id="bg-music" src="ghost-girl-in-my-room-158693.mp3" autoplay loop style="display:none"></audio>
    <h2>If You score out of 3 .I will leave you</h2>
    <div class="choices">
      <button class="choose" data-choice="rock">
        <img src="https://1000logos.net/wp-content/uploads/2024/04/Emoji-Rock.png" alt="Rock" width="80" height="80">
      </button>
      <button class="choose" data-choice="paper">📰</button>
      <button class="choose" data-choice="scissors">✂️</button>
    </div>

  <div class="score">
    <div class="pscore">
      <h3>Player</h3>
      <h5 id="player-score">Score: 0</h5>
    </div>
    <div class="mscore">
      <h3>Ghost</h3>
      <h5 id="machine-score">Score: 0</h5>
    </div>
  </div>

  <div class="result" id="result-text">Dare to play...?</div>

  <button id="exit-button" onclick="window.location.href='index.html'">Exit Game</button>
  </div>

  <!-- Audio -->
  <audio id="cheer-audio" src="yay-6326.mp3"></audio>
  <audio id="ghost-audio" src="gh.mp3"></audio>

  <script>
    const choices = document.querySelectorAll('.choose');
    const playerScoreElem = document.getElementById('player-score');
    const machineScoreElem = document.getElementById('machine-score');
    const resultText = document.getElementById('result-text');
    const exitButton = document.getElementById('exit-button');

    const cheerSound = document.getElementById('cheer-audio');
    const ghostSound = document.getElementById('ghost-audio');

    let playerScore = 0;
    let machineScore = 0;

    const getMachineChoice = () => {
      const options = ['rock', 'paper', 'scissors'];
      return options[Math.floor(Math.random() * options.length)];
    };

    const getResult = (player, machine) => {
      if (player === machine) return 'draw';
      if (
        (player === 'rock' && machine === 'scissors') ||
        (player === 'paper' && machine === 'rock') ||
        (player === 'scissors' && machine === 'paper')
      ) {
        return 'win';
      }
      return 'lose';
    };

    const updateScores = (result) => {
      if (result === 'win') {
        playerScore++;
        resultText.textContent = 'You defeated the ghost! 👻✨';
        cheerSound.play();
      } else if (result === 'lose') {
        machineScore++;
        resultText.textContent = 'The ghost wins... 💀';
        ghostSound.play();
      } else {
        resultText.textContent = "It's a draw... 👁";
      }

      playerScoreElem.textContent = `Score: ${playerScore}`;
      machineScoreElem.textContent = `Score: ${machineScore}`;

      if (playerScore >= 3) {
        exitButton.style.display = 'inline-block';
      }

      if (machineScore >= 3) {
        resultText.textContent = 'You must be Won!';
        choices.forEach(choice => {
          choice.disabled = true;
          choice.style.cursor = 'not-allowed';
        });
        setTimeout(() => {
          window.location.href = 'ouija.html';
        }, 2000);
      }
    };

    choices.forEach(choice => {
      choice.addEventListener('click', () => {
        cheerSound.pause(); cheerSound.currentTime = 0;
        ghostSound.pause(); ghostSound.currentTime = 0;

        const playerChoice = choice.getAttribute('data-choice');
        const machineChoice = getMachineChoice();
        const result = getResult(playerChoice, machineChoice);
        updateScores(result);
      });
      
    });
  </script>
</body>
</html>
